# Tempo 3, monolithic (-target=all): bütün bileşenler tek process'te, Kafka'sız.
# Uygulamalar trace'leri OTLP/HTTP ile gönderir (4318). Veri container'ın içinde durur; down'da silinir.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    compaction:
      block_retention: 24h

usage_report:
  reporting_enabled: false
