global:
  scrape_interval: 15s

# Servis iki şekilde çalışabilir: compose'da (apps profili) ya da IDE'de (host'ta).
# İkisi de scrape edilir; çalışmayan hedef "down" görünür. run etiketi hangisi olduğunu söyler.
scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8081"]
        labels:
          run: compose
      - targets: ["host.docker.internal:8081"]
        labels:
          run: ide
  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["product-service:8082"]
        labels:
          run: compose
      - targets: ["host.docker.internal:8082"]
        labels:
          run: ide
