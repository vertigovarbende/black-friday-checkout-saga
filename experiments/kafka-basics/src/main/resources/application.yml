server:
  port: ${PORT:8100}

spring:
  application:
    name: kafka-basics
  kafka:
    bootstrap-servers: localhost:9092,localhost:9094,localhost:9096
    producer:
      acks: all
      properties:
        # Olmayan bir topic'in metadata'sı için varsayılan 60 sn yerine 5 sn bekle (deney 1)
        max.block.ms: 5000
        # Bir gönderim retry'larla birlikte en fazla 10 sn sürsün; varsayılan 2 dk (deney 2)
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: kafka-basics
      auto-offset-reset: earliest
  # Deney 6 (dual write): doğrudan yolun DB'si; tablo schema.sql ile açılır.
  datasource:
    url: jdbc:postgresql://localhost:5432/experiments
    username: experiments
    password: experiments
  sql:
    init:
      mode: always

experiments:
  dualwrite:
    # Outbox yolunun kontrolü order-service'in DB'sini okur (sadece SELECT).
    outbox-db:
      url: jdbc:postgresql://localhost:5432/order_service
      username: order_service
      password: order_service

logging:
  level:
    org.apache.kafka: WARN
