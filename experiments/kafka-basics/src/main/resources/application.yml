server:
  port: ${PORT:8100}

spring:
  application:
    name: kafka-basics
  kafka:
    bootstrap-servers: localhost:9092,localhost:9094,localhost:9096
    producer:
      acks: all
      properties:
        # Olmayan bir topic'in metadata'sı için varsayılan 60 sn yerine 5 sn bekle (deney 1)
        max.block.ms: 5000
    consumer:
      group-id: kafka-basics
      auto-offset-reset: earliest

logging:
  level:
    org.apache.kafka: WARN
