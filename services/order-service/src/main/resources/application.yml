spring:
  application:
    name: order-service
  flyway:
    # db/seed: lokal çalıştırma için ürün kopyaları. Testler bunun yerine db/testdata'yı kullanır.
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092,localhost:9094,localhost:9096
    # Servis başına tek consumer group; KIP-848 protokolü (ADR-0018). Değerler String olarak okunur,
    # JSON'u listener çözer (EventJsonReader). ErrorHandlingDeserializer: çözülemeyen kayıt poll()'da patlamasın (deney 5.5).
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        group.protocol: consumer
    # Sadece DLT'ye yazmak için. Çözülemeyen kayıt DLT'ye orijinal byte'larıyla gider; String ya da byte[] yazabilmeli.
    producer:
      key-serializer: org.springframework.kafka.support.serializer.StringOrBytesSerializer
      value-serializer: org.springframework.kafka.support.serializer.StringOrBytesSerializer
    # concurrency = partition sayısı: bloklayan retry sadece kendi partition'ını bekletir (deney 5.2).
    listener:
      concurrency: 3
      observation-enabled: true
    template:
      observation-enabled: true

server:
  port: 8081

orderflow:
  datasource:
    primary:
      jdbc-url: jdbc:postgresql://localhost:5432/order_service
      username: order_service
      password: order_service
      pool-name: order-primary
      maximum-pool-size: 10
    replica:
      jdbc-url: jdbc:postgresql://localhost:5433/order_service
      username: order_service
      password: order_service
      pool-name: order-replica
      maximum-pool-size: 10
      read-only: true
  # order-service'in açtığı topic'ler (order.created, şimdilik product.changed, DLT'ler). Compose'da 3 broker;
  # testlerde tek broker olduğu için RF ve min ISR 1.
  kafka:
    topics:
      partitions: 3
      replication-factor: 3
      min-insync-replicas: 2

logging:
  level:
    root: INFO
    com.deveyk.orderflow: INFO
    org.apache.kafka: WARN
  structured:
    json:
      add:
        service: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  # /actuator/health/liveness ve /readiness: Kubernetes probe'ları için (Faz 7).
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  # Metriklerin tek yolu Prometheus'un scrape ettiği /actuator/prometheus; starter'ın OTLP metrik export'u kapalı.
  otlp:
    metrics:
      export:
        enabled: false
