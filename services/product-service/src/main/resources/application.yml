spring:
  application:
    name: product-service
  flyway:
    # db/seed: lokal çalıştırma için ürünler. Testler sadece db/migration'ı kullanır.
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # Ortak consumer / producer ayarları shared-kafka'dan varsayılan olarak gelir (KafkaDefaultsEnvironmentPostProcessor).
  kafka:
    bootstrap-servers: localhost:9092,localhost:9094,localhost:9096

server:
  port: 8082   # 8083 Kafka Connect'te

orderflow:
  datasource:
    primary:
      jdbc-url: jdbc:postgresql://localhost:5432/product_service
      username: product_service
      password: product_service
      pool-name: product-primary
      maximum-pool-size: 10
    replica:
      jdbc-url: jdbc:postgresql://localhost:5433/product_service
      username: product_service
      password: product_service
      pool-name: product-replica
      maximum-pool-size: 10
      read-only: true
  # product-service'in açtığı topic'ler (product.changed, stock.*, DLT'ler). Compose'da 3 broker;
  # testlerde tek broker olduğu için RF ve min ISR 1.
  kafka:
    topics:
      partitions: 3
      replication-factor: 3
      min-insync-replicas: 2

logging:
  level:
    root: INFO
    com.deveyk.orderflow: INFO
    org.apache.kafka: WARN
  structured:
    json:
      add:
        service: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  # /actuator/health/liveness ve /readiness: Kubernetes probe'ları için (Faz 7).
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  # Metriklerin tek yolu Prometheus'un scrape ettiği /actuator/prometheus; starter'ın OTLP metrik export'u kapalı.
  otlp:
    metrics:
      export:
        enabled: false
